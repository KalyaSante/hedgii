name: CI

on:
  push:
  pull_request:

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Check shell scripts
        run: shellcheck --severity=error hedgii.sh install.sh uninstall.sh scripts/*.sh

  integration:
    name: Backup and restore integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y gpg jq rclone rsync unzip zip
      - name: Run local integration tests
        run: bash scripts/test-hedgii.sh
