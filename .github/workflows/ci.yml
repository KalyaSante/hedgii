name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Check shell scripts
        run: shellcheck --severity=error hedgii.sh install.sh uninstall.sh scripts/*.sh tests/*.sh

  tests:
    name: Command and backup/restore tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y gpg jq rclone rsync unzip zip
      - name: Command dispatcher tests
        run: bash tests/test_commands.sh
      - name: Backup and restore integration tests
        run: bash tests/integration.sh
